<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Islam Noor</title>
<style>
html,body{margin:0;height:100%;background:#0f766e;color:#fff;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
display:flex;align-items:center;justify-content:center;text-align:center}
.dot{width:42px;height:42px;margin:0 auto 18px;border:3px solid rgba(255,255,255,.25);
border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
p{opacity:.85;font-size:15px}
</style>
</head>
<body><div><div class="dot"></div><p>Chargement d'Islam Noor...</p></div></body>
</html>
